<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Azhan 🎂</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111, #292929);
    color: white;
    text-align: center;
    overflow: hidden;
}

.container {
    width: 92%;
    max-width: 520px;
    margin: auto;
    margin-top: 7vh;
    padding: 28px 20px;
    background: rgba(255,255,255,0.08);
    border-radius: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

/* START SCREEN */

#startScreen {
    display: block;
}

.bigShoe {
    font-size: 80px;
    animation: bounce 1.5s infinite;
}

h1 {
    font-size: 32px;
    margin-top: 15px;
}

.name {
    font-size: 42px;
    font-weight: bold;
    margin: 10px 0 20px;
}

.description {
    color: #ddd;
    line-height: 1.6;
}

.start-btn,
.prize-btn {
    margin-top: 25px;
    padding: 15px 28px;
    border: none;
    border-radius: 50px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: white;
    color: black;
    transition: 0.3s;
}

.start-btn:hover,
.prize-btn:hover {
    transform: scale(1.08);
}

.creator {
    display: block;
    margin-top: 22px;
    font-size: 12px;
    color: #aaa;
    text-decoration: none;
}

/* GAME */

#gameScreen {
    display: none;
}

.gameTitle {
    font-size: 30px;
    font-weight: bold;
}

.score {
    margin-top: 10px;
    font-size: 19px;
}

.instruction {
    margin-top: 15px;
    color: #ddd;
}

/* GAME AREA */

#gameArea {
    position: relative;
    height: 320px;
    margin-top: 20px;
    border-radius: 20px;
    background: rgba(0,0,0,0.25);
    overflow: hidden;
}

.shoe {
    position: absolute;
    font-size: 55px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s;
}

.shoe:hover {
    transform: scale(1.2);
}

.message {
    min-height: 45px;
    margin-top: 15px;
    font-size: 16px;
}

/* PRIZE BUTTON */

#prizeBtn {
    display: none;
}

/* ANIMATION */

@keyframes bounce {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }

}

</style>
</head>

<body>


<!-- ================= START SCREEN ================= -->

<div class="container" id="startScreen">

    <div class="bigShoe">👟</div>

    <h1>🎂 HAPPY BIRTHDAY</h1>

    <div class="name">
        AZHAN 🎉
    </div>

    <p class="description">
        Oye Shoe King 👑<br>
        Birthday surprise unlock karne ke liye
        pehle ek chhota sa challenge complete karo 😂
    </p>

    <button class="start-btn" onclick="startGame()">
        👟 START SHOE GAME
    </button>

    <a
        class="creator"
        href="https://www.instagram.com/be.like_sahil?stkn=MTF3eWhrZ3o1NWdzeQ=="
        target="_blank"
        rel="noopener noreferrer"
    >
        Created by @be.like_sahil
    </a>

</div>


<!-- ================= GAME SCREEN ================= -->

<div class="container" id="gameScreen">

    <div class="gameTitle">
        👟 SHOE CHALLENGE
    </div>

    <div class="score">
        Shoes Found:
        <span id="score">0</span>/5
    </div>

    <p class="instruction">
        👀 Sirf correct 👟 ko pakdo!
    </p>

    <div id="gameArea"></div>

    <div class="message" id="message">
        Ready? 😂
    </div>

    <button
        id="prizeBtn"
        class="prize-btn"
        onclick="claimPrize()"
    >
        🏆 CLAIM YOUR PRIZE
    </button>

</div>


<script>

/* ================= GAME VARIABLES ================= */

let score = 0;

const totalShoes = 5;


/* ================= START GAME ================= */

function startGame() {

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("gameScreen").style.display = "block";

    createShoe();

}


/* ================= CREATE SHOE ================= */

function createShoe() {

    const gameArea = document.getElementById("gameArea");

    gameArea.innerHTML = "";

    /* Random shoes */

    const shoes = ["👟", "👞", "🩴", "🥾", "👠"];

    const randomWrong1 =
        shoes[Math.floor(Math.random() * shoes.length)];

    const randomWrong2 =
        shoes[Math.floor(Math.random() * shoes.length)];

    /* Correct shoe */

    const correct = document.createElement("div");

    correct.className = "shoe";

    correct.innerHTML = "👟";

    correct.onclick = correctShoe;

    /* Random position */

    correct.style.left =
        Math.random() * 75 + "%";

    correct.style.top =
        Math.random() * 70 + "%";

    gameArea.appendChild(correct);


    /* Wrong shoes */

    for (let i = 0; i < 3; i++) {

        const wrong = document.createElement("div");

        wrong.className = "shoe";

        wrong.innerHTML =
            shoes[Math.floor(Math.random() * shoes.length)];

        wrong.onclick = wrongShoe;

        wrong.style.left =
            Math.random() * 75 + "%";

        wrong.style.top =
            Math.random() * 70 + "%";

        gameArea.appendChild(wrong);

    }

}


/* ================= CORRECT SHOE ================= */

function correctShoe() {

    score++;

    document.getElementById("score").innerText = score;

    document.getElementById("message").innerHTML =
        "✅ Sahi pakde ho Azhan! 👟🔥";

    if (score >= totalShoes) {

        document.getElementById("message").innerHTML =
            "🎉 CHALLENGE COMPLETE!<br>" +
            "Ab asli surprise unlock karo 😂";

        document.getElementById("prizeBtn").style.display =
            "inline-block";

        document.getElementById("gameArea").innerHTML =
            "🏆👟🎉";

    } else {

        setTimeout(createShoe, 600);

    }

}


/* ================= WRONG SHOE ================= */

function wrongShoe() {

    const messages = [

        "😂 Bhai ye kya utha liya?!",

        "❌ Ye shoe nahi chahiye tha!",

        "🤣 Azhan bhai aankhein kholo!",

        "😂 Galat shoe! Dobara try karo!",

        "🩴 Ye prize wala shoe nahi hai!"

    ];

    const randomMessage =
        messages[Math.floor(Math.random() * messages.length)];

    document.getElementById("message").innerHTML =
        "❌ " + randomMessage;

}


/* ================= PRIZE ================= */

function claimPrize() {

    alert(
        "🎉 CONGRATULATIONS AZHAN! 🎉\n\n" +
        "Tumne Shoe Challenge complete kar diya! 👟😂"
    );

}

</script>

</body>
</html>
