<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Azhan 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111, #292929);
            color: white;
            text-align: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 30px 20px;
            background: rgba(255,255,255,0.08);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .shoe {
            font-size: 80px;
            animation: bounce 1.5s infinite;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .name {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        p {
            font-size: 17px;
            color: #ddd;
            line-height: 1.5;
        }

        .start-btn {
            margin-top: 25px;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: black;
            transition: 0.3s;
        }

        .start-btn:hover {
            transform: scale(1.08);
        }

        .creator {
            display: block;
            margin-top: 22px;
            font-size: 12px;
            color: #aaa;
            text-decoration: none;
        }

        .creator:hover {
            color: white;
        }

        /* Game Screen */
        #gameScreen {
            display: none;
        }

        .game-title {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .game-info {
            font-size: 18px;
            margin-bottom: 25px;
            color: #ddd;
        }

        .shoes {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .shoe-btn {
            font-size: 55px;
            padding: 15px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: rgba(255,255,255,0.12);
            transition: 0.2s;
        }

        .shoe-btn:hover {
            transform: scale(1.15);
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }
    </style>
</head>

<body>

    <!-- START SCREEN -->
    <div class="container" id="startScreen">

        <div class="shoe">👟</div>

        <h1>🎂 HAPPY BIRTHDAY</h1>

        <div class="name">
            AZHAN 🎉
        </div>

        <p>
            Oye Shoe King 👑<br>
            Birthday surprise unlock karne ke liye
            ek chhota sa shoe game khelna padega 😂
        </p>

        <button class="start-btn" onclick="startGame()">
            👟 START SHOE GAME
        </button>

        <a
            class="creator"
            href="https://www.instagram.com/be.like_sahil?stkn=MTF3eWhrZ3o1NWdzeQ=="
            target="_blank"
            rel="noopener noreferrer"
        >
            Created by @be.like_sahil
        </a>

    </div>


    <!-- GAME SCREEN -->
    <div class="container" id="gameScreen">

        <div class="shoe">👟</div>

        <div class="game-title">
            👟 Shoe Challenge
        </div>

        <div class="game-info">
            Azhan, sahi shoe choose karo 😂
        </div>

        <div class="shoes">

            <button class="shoe-btn" onclick="wrongShoe()">👞</button>

            <button class="shoe-btn" onclick="correctShoe()">👟</button>

            <button class="shoe-btn" onclick="wrongShoe()">🩴</button>

            <button class="shoe-btn" onclick="wrongShoe()">🥾</button>

        </div>

        <p id="message" style="margin-top:25px;"></p>

    </div>


    <script>

        function startGame() {

            document.getElementById("startScreen").style.display = "none";

            document.getElementById("gameScreen").style.display = "block";

        }


        function wrongShoe() {

            document.getElementById("message").innerHTML =
                "❌ Oye Azhan! Ye kya utha liya 😂<br>Dobara try kar!";

        }


        function correctShoe() {

            document.getElementById("message").innerHTML =
                "✅ Sahi pakde ho! 👟🔥<br>Prize almost unlocked 😂";

        }

    </script>

</body>
</html>
